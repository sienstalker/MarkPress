# MarkPress CI pipeline on GitHub Actions.
# Every push and pull request: lint -> test -> check the site builds.
# Render watches these checks and deploys a commit to production only when they all pass.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:            # adds a "Run workflow" button in the Actions tab

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: flake8 markpress tests

      - name: Test
        run: |
          mkdir -p reports
          pytest --junitxml=reports/junit.xml \
                 --cov=markpress --cov-report=term-missing --cov-report=xml:reports/coverage.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: reports/

  build:
    name: Build site
    needs: test                 # only runs if lint and tests passed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build site
        run: python -m markpress --src content --out public

      - name: Upload built site
        uses: actions/upload-artifact@v6
        with:
          name: site
          path: public/
