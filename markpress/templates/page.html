{% extends "base.html" %}
{% block title %}{{ page.title }} | {{ site_title }}{% endblock %}
{% block content %}
<article>
  <header class="page-header">
    <h1>{{ page.title }}</h1>
    {% if page.date %}<time datetime="{{ page.date.isoformat() }}">{{ page.date.strftime("%d %B %Y") }}</time>{% endif %}
  </header>
  <div class="prose">
    {{ page.html | safe }}
  </div>
  <p class="back"><a href="index.html">All pages</a></p>
</article>
{% endblock %}
