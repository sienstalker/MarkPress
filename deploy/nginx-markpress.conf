# Nginx site for MarkPress.
# Install: sudo cp deploy/nginx-markpress.conf /etc/nginx/sites-available/markpress
#          sudo ln -s /etc/nginx/sites-available/markpress /etc/nginx/sites-enabled/markpress
#          sudo rm -f /etc/nginx/sites-enabled/default
#          sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/markpress;
    index index.html;

    # Pass GitHub webhook calls to Jenkins; the Jenkins UI stays private
    location /github-webhook/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # /welcome and /welcome.html both work
        try_files $uri $uri.html $uri/ =404;
    }

    # Pages change on every deploy, so browsers should re-check them.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }
}
